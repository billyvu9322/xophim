name: ${SERVICE_NAME:-xophim}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the SPA at build time. Same-origin default ("/v1") works when
        # the API serves the SPA.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-5243}
      # Existing PostgreSQL on the VM host (not a container).
      # From inside the container, host.docker.internal resolves to the host (extra_hosts below),
      # e.g. DATABASE_URL=postgresql://user:pass@host.docker.internal:5432/xophim
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # API serves the built SPA from this path inside the image.
      WEB_STATIC_DIR: /app/apps/web/dist
      # Comma-separated browser origins for CORS (same-origin in prod, usually unneeded).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI is required}
    extra_hosts:
      # Linux: lets host.docker.internal resolve to the VM host IP (for the host PostgreSQL).
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-5243}:${API_PORT:-5243}"
    restart: unless-stopped
