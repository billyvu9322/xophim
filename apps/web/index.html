<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#242428" />
    <title>XoPhim — Xem phim online miễn phí</title>
    <style>
      /* Prevent a white flash before the CSS bundle loads. */
      html,
      body {
        margin: 0;
        background: #242428;
      }
      /* App boot splash — shown instantly (before React/bundle), removed by
         main.tsx after mount. Pure inline CSS so it never depends on the JS
         bundle or Tailwind. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #242428;
        transition: opacity 0.45s ease;
      }
      #app-splash.app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        animation: app-splash-pop 1.6s ease-in-out infinite;
      }
      .app-splash__glyph {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: #ffdd95;
      }
      .app-splash__word {
        font-family: Poppins, Arial, sans-serif;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .app-splash__word b {
        color: #ffdd95;
        font-weight: 700;
      }
      .app-splash__word span {
        color: #fff;
      }
      .app-splash__tag {
        font-family: Poppins, Arial, sans-serif;
        font-size: 15px;
        color: #aaaaaa;
      }
      .app-splash__bar {
        position: relative;
        width: 180px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      .app-splash__bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 999px;
        background: #ffdd95;
        animation: app-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-splash-pop {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
      @keyframes app-splash-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__brand,
        .app-splash__bar::after {
          animation: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app-splash">
      <div class="app-splash__brand">
        <span class="app-splash__glyph">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#242428" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </span>
        <span class="app-splash__word"><b>Xo</b><span>Phim</span></span>
      </div>
      <div class="app-splash__tag">Xem phim miễn phí, chất lượng cao</div>
      <div class="app-splash__bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
